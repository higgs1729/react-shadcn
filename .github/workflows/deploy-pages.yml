name: deploy-pages

# Static export of the portfolio app deployed to GitHub Pages, with the
# Storybook build co-located under /storybook on the same origin so
# pattern-detail deep-links resolve. Registry/coverage are read at build time.
on:
  push:
    branches: [main]
  workflow_dispatch:

# GitHub Pages project site is served under /<repo>; the app is built with a
# matching basePath so asset URLs resolve.
env:
  PAGES_BASE_PATH: /react-shadcn

# Allow one concurrent deployment; let an in-progress run finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Gate the deploy on the same contract/lint/type checks the checks
      # workflow runs. Without this the two workflows are independent, and a red
      # `checks` run still publishes (that is how the vendored three.min.js lint
      # failure went unnoticed from 6cbc202). The build and storybook checks are
      # omitted here because the two steps below already perform them.
      - run: npm -w apps/studio run checks -- --only contracts,lint,typecheck
      - run: npm -w apps/team-t run validate
      # Each app statically exports into its own out/. Their basePath already
      # encodes the subdirectory they will occupy, so composing is a plain copy.
      - run: npm run build --workspaces --if-present
      # Component lab co-located at /<repo>/storybook (relative-asset build).
      - run: npm -w apps/studio run build-storybook
      # Compose the deployable tree: the portal takes the root, every other app
      # goes into the subdirectory matching its basePath.
      - run: |
          mkdir -p dist
          cp -r apps/portal/out/* dist/
          for app in studio team-t python-test gamehub; do
            mkdir -p "dist/$app"
            cp -r "apps/$app/out/." "dist/$app/"
          done
          mkdir -p dist/storybook
          cp -r apps/studio/storybook-static/* dist/storybook/
          # Bypass Jekyll so the _next/ directory is served verbatim.
          touch dist/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

name: deploy-gamehub-stats

on:
  push:
    branches: [main]
    paths:
      - "apps/gamehub/stats-worker/**"
      - "apps/gamehub/package.json"
      - "package-lock.json"
      - ".github/workflows/deploy-gamehub-stats.yml"
  workflow_dispatch:

concurrency:
  group: gamehub-stats
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Inject the D1 database id
        env:
          D1_DATABASE_ID: ${{ secrets.GAMEHUB_STATS_D1_DATABASE_ID }}
        run: |
          test -n "$D1_DATABASE_ID"
          sed -i "s/REPLACE_WITH_CLOUDFLARE_D1_DATABASE_ID/$D1_DATABASE_ID/" apps/gamehub/stats-worker/wrangler.jsonc
      - name: Apply D1 migrations
        run: npx wrangler --config apps/gamehub/stats-worker/wrangler.jsonc d1 migrations apply react-shadcn-gamehub-stats --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy the stats Worker
        run: npx wrangler --config apps/gamehub/stats-worker/wrangler.jsonc deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

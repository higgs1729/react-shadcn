name: checks

on:
  push:
    branches: [master]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Fans out to every workspace's own `checks` script (npm run checks
      # --workspaces --if-present). For apps/studio that is scripts/run-checks.mjs:
      # contracts (ajv) -> lint -> typecheck -> next build -> storybook build.
      - run: npm run checks
